name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android command-line
      # SDK. Install only the project platform explicitly; do not request the
      # retired legacy `tools` package.
      - name: Install Android 37 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static governance and compatibility gates
        run: |
          python3 scripts/check_doc_governance.py
          python3 scripts/check_doc_defaults.py
          python3 scripts/check_readme_defaults.py
          python3 scripts/check_locale_keys.py
          python3 scripts/check_android17_readiness.py
          python3 scripts/check_16kb_readiness.py
          python3 scripts/check_api_key_storage.py
          python3 scripts/check_ors_endpoint.py
          python3 scripts/check_graphics_path_compat.py

      # F-DOC1-008 bootstrap: CI generates the missing Wrapper JAR from the
      # pinned Gradle 9.6.0 installation until that binary is committed.
      - name: Bootstrap Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x ./gradlew

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
