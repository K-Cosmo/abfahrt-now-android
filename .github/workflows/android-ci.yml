name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The current GitHub Ubuntu image already ships Android 37.x platforms
      # and Build Tools 37.0.0. Do not re-install or request retired SDK
      # packages; the Gradle build below is the real availability gate.
      - name: Verify hosted Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          test -d "$ANDROID_HOME/platforms"
          ls -1 "$ANDROID_HOME/platforms" | grep '^android-37' >/dev/null
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static governance and compatibility gates
        run: |
          python3 scripts/check_doc_governance.py
          python3 scripts/check_doc_defaults.py
          python3 scripts/check_readme_defaults.py
          python3 scripts/check_locale_keys.py
          python3 scripts/check_android17_readiness.py
          python3 scripts/check_16kb_readiness.py
          python3 scripts/check_api_key_storage.py
          python3 scripts/check_ors_endpoint.py
          python3 scripts/check_graphics_path_compat.py

      # F-DOC1-008 bootstrap: CI generates the missing Wrapper JAR from the
      # pinned Gradle 9.6.0 installation until that binary is committed.
      - name: Bootstrap Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x ./gradlew

      - name: Unit tests and debug build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
