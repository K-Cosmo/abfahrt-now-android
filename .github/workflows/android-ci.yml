name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Static governance and compatibility gates
        run: |
          python scripts/check_doc_governance.py
          python scripts/check_doc_defaults.py
          python scripts/check_readme_defaults.py
          python scripts/check_locale_keys.py
          python scripts/check_android17_readiness.py
          python scripts/check_16kb_readiness.py
          python scripts/check_api_key_storage.py
          python scripts/check_ors_endpoint.py
          python scripts/check_graphics_path_compat.py

      # F-DOC1-008 bootstrap: the generated wrapper is validated in CI until
      # gradlew/gradlew.bat/gradle-wrapper.jar are committed to the repository.
      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
