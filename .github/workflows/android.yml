name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Bootstrap verified Gradle wrapper JAR when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --location --silent --show-error \
              --output gradle/wrapper/gradle-wrapper.jar \
              https://services.gradle.org/distributions/gradle-9.6.0-wrapper.jar
          fi
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          chmod +x ./gradlew

      - name: Run static project gates
        run: |
          python3 scripts/check_doc_governance.py
          python3 scripts/check_doc_defaults.py
          python3 scripts/check_readme_defaults.py
          python3 scripts/check_locale_keys.py
          python3 scripts/check_android17_readiness.py
          python3 scripts/check_16kb_readiness.py
          python3 scripts/check_api_key_storage.py
          python3 scripts/check_ors_endpoint.py
          python3 scripts/check_graphics_path_compat.py

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
