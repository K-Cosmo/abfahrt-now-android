# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX — no legacy support library in this project
android.useAndroidX=true
# Jetifier not needed: pure AndroidX/Compose project, no legacy dependencies
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Build 132 compiles and targets Android 17 / API 37 after Build 131 proved the AGP-9/API-37 toolchain and runtime path.
# AGP 9 built-in Kotlin is intentionally left enabled (default); do not add android.builtInKotlin=false.
