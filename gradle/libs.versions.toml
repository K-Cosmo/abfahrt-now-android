[versions]
agp                  = "9.4.0"
kotlin               = "2.3.21"
ksp                  = "2.3.12"
hilt                 = "2.60.1"
composeBom           = "2025.02.00"
coreKtx              = "1.15.0"
lifecycleRuntime     = "2.8.7"
activityCompose      = "1.10.1"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
gson                 = "2.11.0"
datastore            = "1.2.1"
coroutines           = "1.10.1"
locationServices     = "21.3.0"
navigationCompose    = "2.8.5"
accompanistPermissions = "0.37.0"
splashscreen         = "1.0.1"
junit                = "4.13.2"

[libraries]
androidx-core-ktx              = { group = "androidx.core",        name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-compose",    version.ref = "lifecycleRuntime" }
androidx-lifecycle-process     = { group = "androidx.lifecycle",   name = "lifecycle-process",              version.ref = "lifecycleRuntime" }
androidx-lifecycle-compose     = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose",      version.ref = "lifecycleRuntime" }
androidx-activity-compose      = { group = "androidx.activity",    name = "activity-compose",               version.ref = "activityCompose" }
compose-bom                    = { group = "androidx.compose",     name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",  name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",  name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",  name = "ui-tooling-preview" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons         = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling             = { group = "androidx.compose.ui",  name = "ui-tooling" }
navigation-compose             = { group = "androidx.navigation",  name = "navigation-compose",             version.ref = "navigationCompose" }
hilt-android                   = { group = "com.google.dagger",    name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",    name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",        name = "hilt-navigation-compose",       version = "1.2.0" }
retrofit-core                  = { group = "com.squareup.retrofit2", name = "retrofit",                    version.ref = "retrofit" }
retrofit-gson                  = { group = "com.squareup.retrofit2", name = "converter-gson",              version.ref = "retrofit" }
okhttp-logging                 = { group = "com.squareup.okhttp3",  name = "logging-interceptor",          version.ref = "okhttp" }
gson                           = { group = "com.google.code.gson",  name = "gson",                        version.ref = "gson" }
datastore-preferences          = { group = "androidx.datastore",   name = "datastore-preferences",         version.ref = "datastore" }
kotlinx-coroutines             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
play-services-location         = { group = "com.google.android.gms", name = "play-services-location",     version.ref = "locationServices" }
accompanist-permissions        = { group = "com.google.accompanist", name = "accompanist-permissions",     version.ref = "accompanistPermissions" }
androidx-splashscreen          = { group = "androidx.core",         name = "core-splashscreen",            version.ref = "splashscreen" }
junit                          = { group = "junit",                 name = "junit",                         version.ref = "junit" }

[plugins]
android-application   = { id = "com.android.application",        version.ref = "agp" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                  = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                   = { id = "com.google.devtools.ksp",        version.ref = "ksp" }
